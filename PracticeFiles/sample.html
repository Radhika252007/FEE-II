<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Float Example</title>
<style>
  .container{
    overflow-x: hidden;
    position: relative;
    display: flex;
    height: 200px;
    width: 600px;
    background-color: blue;
  }
  .left,.right{
    height: 100%;
    width: 50%;
    position: absolute;
    right: 0;
  }
  .toggle{
    width: 100%;
    height: 100%;
    position: absolute;
  }
  .toggle::before{
    content: '';
    background-color: gray;
    width: 300%;
    height: 100%;
    position: absolute;
  }
</style>
</head>
<body>
<div class="container">
<!-- <div class="left" style="background-color: red;">Left Column</div>
<div class="right">Right Column</div></div> -->
<div class="toggle">

</div>
</body>
</html>
